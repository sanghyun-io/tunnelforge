[package]
name = "tunnelforge-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "migration_core"
path = "src/lib.rs"

[[bin]]
name = "tunnelforge-core"
path = "src/main.rs"

[dependencies]
hex = "0.4"
mysql = { version = "26", features = ["native-tls"] }
native-tls = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"

# Vendored mysql 26.0.1 + SslOpts::with_tls_server_name (see vendor/mysql/PATCH.md).
[patch.crates-io]
mysql = { path = "vendor/mysql" }
