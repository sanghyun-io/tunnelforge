name: Version Gate

# PR 라벨 기반 버전 bump — 필수 상태 체크
#
# version:* 라벨이 있으면 PR 브랜치에 bump 커밋 자동 추가.
# 브랜치 보호 규칙으로 이 체크가 통과해야만 머지 가능.

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]

concurrency:
  group: version-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos-support-tracking-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      checks: read

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check macOS support GitHub tracking gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check-macos-support-gate.py \
            --repo "${{ github.repository }}" \
            --skip-pr-checks

  rust-core-regression-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout PR
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run Rust Core regression gate
        shell: pwsh
        run: ./scripts/rust-core-regression-gate.ps1

      - name: Run Rust Core tests
        run: cargo test --manifest-path migration_core/Cargo.toml

  dump-roundtrip-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tf_local_test
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: tf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptf_local_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tf_local_test
          POSTGRES_DB: tf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tf_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TF_MYSQL_HOST: 127.0.0.1
      TF_PROMOTE_MYSQL_HOST: 127.0.0.1
      TF_MYSQL_PORT: "3306"
      TF_MYSQL_USER: root
      TF_MYSQL_PASSWORD: tf_local_test
      TF_MYSQL_DATABASE: tf_test
      TF_POSTGRES_HOST: 127.0.0.1
      TF_POSTGRES_PORT: "5432"
      TF_POSTGRES_USER: postgres
      TF_POSTGRES_PASSWORD: tf_local_test
      TF_POSTGRES_DATABASE: tf_test

    steps:
      - name: Checkout PR
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run live export and import regressions
        run: |
          cargo test --manifest-path migration_core/Cargo.toml \
            --test live_roundtrip \
            --test live_binary_keyset \
            --test live_keyset_pk_matrix \
            --test live_mysql_bit \
            --test live_mysql_spatial \
            --test live_cross_engine_types \
            --test live_dump_cross_engine \
            --test live_schema_fidelity \
            --test live_import_policy \
            --test live_foreign_key_actions \
            --test live_export_contract \
            --test live_fault_injection \
            --test live_safe_restore \
            --test live_backup_lifecycle \
            -- --include-ignored --test-threads=1
          cargo test --manifest-path migration_core/Cargo.toml --lib safe_promote_ -- --test-threads=1
          cargo test --manifest-path migration_core/Cargo.toml --lib import::safe_restore_digest:: -- --include-ignored --test-threads=1

  live-security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tf_local_test
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: tfdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptf_local_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tf_local_test
          POSTGRES_DB: tfdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tfdb"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      # Live tests normally return early without their environment; here a
      # missing variable must fail the gate instead of passing silently.
      TF_LIVE_REQUIRED: "1"
      TF_QUERY_LIVE_MYSQL_HOST: 127.0.0.1
      TF_QUERY_LIVE_MYSQL_PORT: "3306"
      TF_QUERY_LIVE_MYSQL_USER: root
      TF_QUERY_LIVE_MYSQL_PASSWORD: tf_local_test
      TF_QUERY_LIVE_MYSQL_DATABASE: tfdb
      TF_QUERY_LIVE_PG_HOST: 127.0.0.1
      TF_QUERY_LIVE_PG_PORT: "5432"
      TF_QUERY_LIVE_PG_USER: postgres
      TF_QUERY_LIVE_PG_PASSWORD: tf_local_test
      TF_QUERY_LIVE_PG_DATABASE: tfdb
      TF_TLS_CERT_DIR: /tmp/tf-tls-certs
      TF_TLS_TEST_CERT_DIR: /tmp/tf-tls-certs

    steps:
      - name: Checkout PR
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build live security tests
        run: |
          cargo test --manifest-path migration_core/Cargo.toml --no-run \
            --test live_query_control \
            --test live_read_only_session \
            --test live_tls \
            --test live_tls_cancel

      - name: Run query control and read-only session regressions
        run: |
          cargo test --manifest-path migration_core/Cargo.toml \
            --test live_query_control \
            --test live_read_only_session \
            -- --test-threads=1

      - name: Start TLS test servers
        run: |
          bash scripts/tls_live_env.sh certs
          bash scripts/tls_live_env.sh up-pg
          bash scripts/tls_live_env.sh up-mysql
          bash scripts/tls_live_env.sh cert pg good
          bash scripts/tls_live_env.sh cert mysql good

      - name: Run TLS verification and cancellation regressions
        env:
          TF_TLS_TEST_ENV_SCRIPT: ${{ github.workspace }}/scripts/tls_live_env.sh
        run: |
          cargo test --manifest-path migration_core/Cargo.toml \
            --test live_tls \
            --test live_tls_cancel \
            -- --test-threads=1

      - name: Run TLS fail-closed regression without server TLS
        env:
          TF_TLS_TEST_ENV_SCRIPT: ${{ github.workspace }}/scripts/tls_live_env.sh
          TF_TLS_TEST_MYSQL_NOSSL: "1"
        run: |
          bash scripts/tls_live_env.sh up-mysql-nossl
          cargo test --manifest-path migration_core/Cargo.toml \
            --test live_tls mysql_verified_tls_fails_closed_without_server_tls \
            -- --test-threads=1

      - name: Remove TLS test servers
        if: always()
        run: bash scripts/tls_live_env.sh down

  python-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout PR
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build tunnelforge-core (Rust)
        shell: pwsh
        run: cargo build --manifest-path migration_core/Cargo.toml --release

      - name: Run full Python regression suite
        shell: pwsh
        run: pytest -q

      - name: Build frozen main app
        shell: pwsh
        run: python -m PyInstaller tunnel-manager.spec --noconfirm

      - name: Smoke frozen main app
        shell: pwsh
        run: python scripts/verify-frozen-app.py dist/TunnelForge/TunnelForge.exe --timeout 60

      - name: Build and self-check frozen WebSetup
        shell: pwsh
        run: |
          pyinstaller bootstrapper/bootstrapper.spec
          $executable = "dist\TunnelForge-WebSetup.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "missing frozen WebSetup artifact: $executable"
          }
          $output = (& .\dist\TunnelForge-WebSetup.exe --self-check | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "frozen WebSetup self-check exited with $LASTEXITCODE"
          }
          if ($output -ne "TUNNELFORGE_WEBSETUP_SELF_CHECK_OK") {
            throw "unexpected frozen WebSetup self-check output: '$output'"
          }

  python-linux-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout PR
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libdbus-1-3 libxkbcommon0 python3-tk

      - name: Set up Rust
        run: |
          rustc --version
          cargo --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build tunnelforge-core (Rust)
        run: cargo build --manifest-path migration_core/Cargo.toml --release

      - name: Run full Python regression suite
        run: pytest -q

      - name: Build frozen main app
        run: python -m PyInstaller tunnel-manager.spec --noconfirm

      - name: Smoke frozen main app
        run: python scripts/verify-frozen-app.py dist/TunnelForge/TunnelForge --timeout 60

  macos-app-validation:
    name: macOS App Validation (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout PR
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Rust
        run: |
          rustc --version
          cargo --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve version
        id: version
        run: |
          VERSION="$(python -c 'from src.version import __version__; print(__version__)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run focused macOS tests
        run: |
          pytest \
            tests/test_platform_paths.py \
            tests/test_platform_integration.py \
            tests/test_resources.py \
            tests/test_update_downloader.py \
            tests/test_rust_core_packaging.py \
            tests/test_settings_update_actions.py \
            tests/test_app_self_check.py \
            tests/test_db_connection_responsiveness.py \
            tests/test_macos_support_docs.py
          cargo test --manifest-path migration_core/Cargo.toml

      - name: Smoke source-run TunnelForge app
        run: |
          cargo build --manifest-path migration_core/Cargo.toml --release
          RESPONSE="$(python main.py --ui-smoke-check)"
          echo "$RESPONSE"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RESPONSE"])
          assert data["success"] is True
          assert data["window_title"] == "TunnelForge"
          assert data["self_check"]["icon_exists"] is True
          assert data["self_check"]["core_exists"] is True
          assert data["self_check"]["core_hello"]["service"] == "tunnelforge-core"
          assert data["self_check"]["core_hello"]["success"] is True
          PY

      - name: Build macOS app
        run: bash scripts/build-macos.sh

      - name: Smoke packaged TunnelForge app
        run: |
          APP_EXECUTABLE="dist/TunnelForge.app/Contents/MacOS/TunnelForge"
          test -x "$APP_EXECUTABLE"
          RESPONSE="$("$APP_EXECUTABLE" --ui-smoke-check)"
          echo "$RESPONSE"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RESPONSE"])
          assert data["success"] is True
          assert data["window_title"] == "TunnelForge"
          data = data["self_check"]
          assert data["icon_exists"] is True
          assert data["core_exists"] is True
          assert data["core_hello"]["event"] == "result"
          assert data["core_hello"]["request_id"] == "self-check"
          assert data["core_hello"]["service"] == "tunnelforge-core"
          assert data["core_hello"]["success"] is True
          PY

      - name: Package macOS app
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/package-macos.sh "${{ steps.version.outputs.version }}"
          test -f "dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          test -f "dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip"
          test -f "dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg.sha256"
          test -f "dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip.sha256"

      - name: Smoke DMG package
        run: |
          DMG_PATH="dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          DMG_SMOKE_MOUNT="$PWD/build/dmg-smoke-mount"
          rm -rf "$DMG_SMOKE_MOUNT"
          mkdir -p "$DMG_SMOKE_MOUNT"
          source scripts/macos-dmg-mount.sh
          dmg_attach "$DMG_PATH" "$DMG_SMOKE_MOUNT"
          trap 'dmg_detach "$DMG_SMOKE_MOUNT" || true' EXIT
          APP_EXECUTABLE="$DMG_SMOKE_MOUNT/TunnelForge.app/Contents/MacOS/TunnelForge"
          test -x "$APP_EXECUTABLE"
          RESPONSE="$("$APP_EXECUTABLE" --ui-smoke-check)"
          echo "$RESPONSE"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RESPONSE"])
          assert data["success"] is True
          assert data["window_title"] == "TunnelForge"
          data = data["self_check"]
          assert data["icon_exists"] is True
          assert data["core_exists"] is True
          assert data["core_hello"]["service"] == "tunnelforge-core"
          assert data["core_hello"]["success"] is True
          PY

      - name: Smoke copied DMG install
        run: |
          DMG_PATH="dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          INSTALL_SMOKE_MOUNT="$PWD/build/install-smoke-mount"
          rm -rf "$INSTALL_SMOKE_MOUNT" build/install-smoke
          mkdir -p "$INSTALL_SMOKE_MOUNT" build/install-smoke
          source scripts/macos-dmg-mount.sh
          dmg_attach "$DMG_PATH" "$INSTALL_SMOKE_MOUNT"
          trap 'dmg_detach "$INSTALL_SMOKE_MOUNT" || true' EXIT
          ditto "$INSTALL_SMOKE_MOUNT/TunnelForge.app" "build/install-smoke/TunnelForge.app"
          dmg_detach "$INSTALL_SMOKE_MOUNT"
          trap - EXIT
          APP_EXECUTABLE="build/install-smoke/TunnelForge.app/Contents/MacOS/TunnelForge"
          test -x "$APP_EXECUTABLE"
          RESPONSE="$("$APP_EXECUTABLE" --ui-smoke-check)"
          echo "$RESPONSE"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RESPONSE"])
          assert data["success"] is True
          assert data["window_title"] == "TunnelForge"
          data = data["self_check"]
          assert data["icon_exists"] is True
          assert data["core_exists"] is True
          assert data["core_hello"]["service"] == "tunnelforge-core"
          assert data["core_hello"]["success"] is True
          PY

      - name: Smoke LaunchAgent registration
        run: bash scripts/smoke-macos-launchagent.sh build/install-smoke/TunnelForge.app

      - name: Smoke /Applications install
        env:
          MACOS_APPLICATIONS_SMOKE_ALLOW_SYSTEM: "1"
        run: |
          DMG_PATH="dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          bash scripts/smoke-macos-applications-install.sh "$DMG_PATH"

      - name: Smoke ZIP package
        run: |
          ZIP_PATH="dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip"
          rm -rf build/zip-smoke
          mkdir -p build/zip-smoke
          ditto -x -k "$ZIP_PATH" build/zip-smoke
          APP_EXECUTABLE="build/zip-smoke/TunnelForge.app/Contents/MacOS/TunnelForge"
          test -x "$APP_EXECUTABLE"
          RESPONSE="$("$APP_EXECUTABLE" --ui-smoke-check)"
          echo "$RESPONSE"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RESPONSE"])
          assert data["success"] is True
          assert data["window_title"] == "TunnelForge"
          data = data["self_check"]
          assert data["icon_exists"] is True
          assert data["core_exists"] is True
          assert data["core_hello"]["service"] == "tunnelforge-core"
          assert data["core_hello"]["success"] is True
          PY

      - name: Upload macOS validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
            dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg.sha256
            dist/TunnelForge-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  version-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      bump_type: ${{ steps.check.outputs.bump_type }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check version labels
        id: check
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # === Step 1: 라벨 검증 (최우선) ===
          VERSION_LABELS=$(echo "$PR_LABELS" | python3 -c "
          import json, sys
          labels = json.load(sys.stdin)
          version_labels = [l for l in labels if l.startswith('version:')]
          for l in version_labels:
              print(l)
          ")

          COUNT=$(echo "$VERSION_LABELS" | grep -c 'version:' || true)
          echo "감지된 version 라벨 수: $COUNT"

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: 복수의 version 라벨 감지: $VERSION_LABELS"
            gh pr comment "$PR_NUMBER" --body \
              "⚠️ **Auto-version 실패**: 복수의 version 라벨이 감지되었습니다.

          감지된 라벨: \`$(echo $VERSION_LABELS | tr '\n' ' ')\`

          정확히 **1개**의 version 라벨만 허용됩니다:
          - \`version:patch\` — 버그 수정 (X.Y.Z+1)
          - \`version:minor\` — 새 기능 (X.Y+1.0)
          - \`version:major\` — Breaking changes (X+1.0.0)"
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "version 라벨 없음. 버전 bump 불필요 — 통과."
            echo "bump_type=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP_TYPE=$(echo "$VERSION_LABELS" | head -1 | sed 's/version://')
          echo "감지된 bump_type: $BUMP_TYPE"

          # Commit messages are not evidence of a completed bump. The trusted
          # version-bump job verifies all three version files against the
          # expected version calculated from the trusted base.
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

  version-bump:
    runs-on: ubuntu-24.04
    needs: version-validation
    if: needs.version-validation.result == 'success' && needs.version-validation.outputs.bump_type != ''
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Prepare trusted version bump from PR data
        id: bump
        env:
          BUMP_TYPE: ${{ needs.version-validation.outputs.bump_type }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          mkdir -p .version-bump-input/src .version-bump-input/installer .version-bump-input/docs
          cp src/version.py .version-bump-input/src/version.py
          cp pyproject.toml .version-bump-input/pyproject.toml
          cp installer/TunnelForge.iss .version-bump-input/installer/TunnelForge.iss
          # 3개 버전 파일은 봇 소유라 base 복사 후 전면 재기록해도 안전하지만,
          # current_status.md 는 PR 이 손으로 편집하는 문서다. base 를 복사해
          # 덮어쓰면 PR 의 문서 편집이 사라진다. HEAD 에서 가져와 마커 라인만
          # 바꾼다(HEAD 객체는 위 fetch 로 확보됨).
          git show "$HEAD_SHA:docs/current_status.md" > .version-bump-input/docs/current_status.md
          python scripts/bump_version.py \
            --bump-type "$BUMP_TYPE" \
            --version-file .version-bump-input/src/version.py \
            --pyproject-file .version-bump-input/pyproject.toml \
            --installer-file .version-bump-input/installer/TunnelForge.iss \
            --status-doc .version-bump-input/docs/current_status.md \
            > /tmp/bump.txt
          EXPECTED=$(grep 'new_version=' /tmp/bump.txt | cut -d= -f2)
          CURRENT_PY=$(git show "$HEAD_SHA:src/version.py" | grep '__version__' | cut -d'"' -f2)
          CURRENT_PROJECT=$(git show "$HEAD_SHA:pyproject.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)
          CURRENT_INSTALLER=$(git show "$HEAD_SHA:installer/TunnelForge.iss" | sed -n 's/^#define MyAppVersion "\([^"]*\)"/\1/p' | head -1)
          # current_status.md 의 'Current shipping version' 마커(있으면). '.v' 의
          # '.' 로 백틱을 매칭해 셸에서 백틱 커맨드치환을 피한다. 마커는 fail-soft
          # 대상이라 비어 있어도 아래 -z 가드에 넣지 않는다(비면 skip=false 로
          # 떨어져 bump 가 돌며 마커를 동기화 -> 자가치유).
          CURRENT_MARKER=$(git show "$HEAD_SHA:docs/current_status.md" | sed -n 's/.*Current shipping version:[[:space:]]*.v\([0-9.]*\).*/\1/p' | head -1)
          echo "expected=$EXPECTED python=$CURRENT_PY project=$CURRENT_PROJECT installer=$CURRENT_INSTALLER marker=$CURRENT_MARKER"

          if [ -z "$EXPECTED" ] || [ -z "$CURRENT_PY" ] || \
             [ -z "$CURRENT_PROJECT" ] || [ -z "$CURRENT_INSTALLER" ]; then
            echo "ERROR: version parse failed"
            exit 1
          fi

          if [ "$CURRENT_PY" = "$EXPECTED" ] && \
             [ "$CURRENT_PROJECT" = "$EXPECTED" ] && \
             [ "$CURRENT_INSTALLER" = "$EXPECTED" ] && \
             [ "$CURRENT_MARKER" = "$EXPECTED" ]; then
            echo "All PR version files and the status marker match the trusted expected version. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "new_version=$EXPECTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.bump.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Commit trusted bump tree and push
        if: steps.bump.outputs.skip != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/version-bump-index"
          git read-tree "$HEAD_SHA"
          for path in src/version.py pyproject.toml installer/TunnelForge.iss docs/current_status.md; do
            mode=$(git ls-tree "$HEAD_SHA" -- "$path" | awk '{print $1}')
            blob=$(git hash-object -w ".version-bump-input/$path")
            git update-index --add --cacheinfo "$mode,$blob,$path"
          done
          tree=$(git write-tree)
          commit=$(printf '%s\n' \
            "chore: bump version to v${NEW_VERSION} [${{ needs.version-validation.outputs.bump_type }}]" \
            | git commit-tree "$tree" -p "$HEAD_SHA")
          git push \
            "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" \
            "$commit:refs/heads/$HEAD_REF"
          echo "version bump completed: v${NEW_VERSION}"

  version-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - macos-support-tracking-gate
      - rust-core-regression-gate
      - dump-roundtrip-regression
      - live-security-regression
      - python-regression
      - python-linux-regression
      - macos-app-validation
      - version-validation
      - version-bump
    if: always()
    permissions: {}

    steps:
      - name: Require successful terminal gate state
        env:
          MACOS_TRACKING_RESULT: ${{ needs.macos-support-tracking-gate.result }}
          RUST_RESULT: ${{ needs.rust-core-regression-gate.result }}
          DUMP_ROUNDTRIP_RESULT: ${{ needs.dump-roundtrip-regression.result }}
          LIVE_SECURITY_RESULT: ${{ needs.live-security-regression.result }}
          PYTHON_RESULT: ${{ needs.python-regression.result }}
          LINUX_PYTHON_RESULT: ${{ needs.python-linux-regression.result }}
          MACOS_APP_RESULT: ${{ needs.macos-app-validation.result }}
          VERSION_VALIDATION_RESULT: ${{ needs.version-validation.result }}
          VERSION_BUMP_RESULT: ${{ needs.version-bump.result }}
          BUMP_TYPE: ${{ needs.version-validation.outputs.bump_type }}
        run: |
          set -euo pipefail

          for result in \
            "$MACOS_TRACKING_RESULT" \
            "$RUST_RESULT" \
            "$DUMP_ROUNDTRIP_RESULT" \
            "$LIVE_SECURITY_RESULT" \
            "$PYTHON_RESULT" \
            "$LINUX_PYTHON_RESULT" \
            "$MACOS_APP_RESULT" \
            "$VERSION_VALIDATION_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "ERROR: required job result is '$result'"
              exit 1
            fi
          done

          if [ -z "$BUMP_TYPE" ]; then
            if [ "$VERSION_BUMP_RESULT" != "skipped" ]; then
              echo "ERROR: version-bump must be skipped when no bump is required"
              exit 1
            fi
          else
            if [ "$VERSION_BUMP_RESULT" != "success" ]; then
              echo "ERROR: version-bump result is '$VERSION_BUMP_RESULT'"
              exit 1
            fi
          fi
